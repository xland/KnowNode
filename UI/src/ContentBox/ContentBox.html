<div id="contentBox">
  <!-- 拖列表的右边缘 → 改列表宽度（画布拿剩下的） -->
  <div class="splitter" data-target="knowList" data-edge="right"></div>
  <!-- 拖详情的左边缘 → 改详情宽度 -->
  <div class="splitter" data-target="knowDetail" data-edge="left"></div>
  <!-- 详细内容面板的展开 / 收起按钮：贴右边缘垂直居中，展开后挪到面板左边缘（见 syncToggle()） -->
  <span id="detailToggle" class="icon icon-expand-left" title="展开详细内容"></span>
</div>
