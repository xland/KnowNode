<div id="knowNet">
  <div class="knowNetCanvas"></div>
  <!-- 左上角悬浮搜索层：加载了知识才显示；回车 / 点图标 = 按标题找节点，把第一个命中的挪到视口中心并选中 -->
  <div class="knowNetSearch">
    <input class="knowNetSearchInput" type="text" placeholder="搜索节点标题" />
    <span class="icon icon-search knowNetSearchBtn" title="搜索"></span>
  </div>
  <!-- 搜不到时的一行提示，2 秒后自己没 -->
  <div class="knowNetTip"></div>
  <!-- 右上角「回到中心」：画布被拖到偏远角落时，把全部节点的中心重新对回视口正中 -->
  <span class="icon icon-center knowNetCenter" title="回到中心"></span>
  <!-- 双击节点时就地改标题用的输入框：平时藏着，改的时候按节点位置与当前缩放盖上去 -->
  <input class="knowNetTitleEdit" type="text" />
</div>
